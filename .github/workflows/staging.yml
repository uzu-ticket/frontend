name: Deploy Staging (Frontend)

on:
  push:
    branches:
      - staging
      - develop
  workflow_dispatch:


jobs:
  test:
    name: Test & Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run Build
        run: npm run build
        env:
          NUXT_PUBLIC_API_BASE: ${{ vars.STAGING_API_BASE || 'https://staging-api.uzuticket.com' }}

